# SentinelPay — scheduled / drift-triggered retraining (Phase 7)
# ===============================================================
# Exercises the WHOLE self-updating loop — bootstrap a champion, retrain a
# challenger on "newer" data, judge both on a shared evaluation window, and let
# the promotion gate decide — on every schedule tick and on demand.
#
# Why synthetic data here: the real dataset is git-ignored (GitHub runners
# never see it) and the real Postgres/MLflow live in the local docker-compose
# stack. So this workflow proves the AUTOMATION — the exact same entrypoint
# (`python -m src.retrain`) that production retraining uses — against a
# synthetic dataset and a throwaway sqlite MLflow registry. Real retraining
# runs where the data lives:
#
#     docker compose --profile retrain run --rm retrainer
#
# and is triggered on drift by scripts/auto_retrain_on_drift.py (which can
# equally call `gh workflow run retrain.yml -f reason=drift` to run it here).
#
# The job SUCCEEDS whether the gate promotes or refuses — a refusal is the
# guard-rail working. It fails only if the pipeline itself breaks.

name: Retrain

on:
  schedule:
    - cron: "0 3 * * 1"        # every Monday 03:00 UTC
  workflow_dispatch:
    inputs:
      reason:
        description: "Why retraining was triggered (e.g. 'drift', 'manual')"
        required: false
        default: "manual"

jobs:
  retrain-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-api.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-api.txt

      - name: Log trigger
        run: echo "Retraining triggered by '${{ github.event_name }}' (reason= ${{ inputs.reason || 'schedule' }})"

      # Two synthetic windows: January is the world the champion knows;
      # February (drawn with a different seed and a higher fraud rate, i.e.
      # drifted) is the "recent labelled data" the challenger learns from.
      - name: Generate synthetic base + recent data
        run: |
          python src/synthetic_data.py --rows 24000 --cards 400 --fraud-rate 0.010 \
            --start 2024-01-01 --days 31 --seed 42 --out data_ci/base.csv
          python src/synthetic_data.py --rows 8000 --cards 400 --fraud-rate 0.025 \
            --start 2024-02-01 --days 14 --seed 43 --out data_ci/recent.csv

      # A champion must exist before the gate has anything to defend: train one
      # on the base window only and promote it (the registry is empty, so this
      # is the legitimate bootstrap path).
      - name: Bootstrap champion (base window only)
        run: |
          python src/retrain.py \
            --recent-csv data_ci/base.csv \
            --base-csv none \
            --tracking-uri sqlite:///mlflow-ci.db \
            --min-eval-rows 100

      # The loop under test: pull "recent labelled data", train a challenger on
      # base + recent, evaluate BOTH models on the newest slice, gate, decide.
      - name: Retrain challenger and run the promotion gate
        run: |
          python src/retrain.py \
            --recent-csv data_ci/recent.csv \
            --base-csv data_ci/base.csv \
            --tracking-uri sqlite:///mlflow-ci.db \
            --min-eval-rows 100

      - name: Show gate decision
        run: cat reports/retrain/promotion_report.json

      - name: Upload promotion report
        uses: actions/upload-artifact@v4
        with:
          name: promotion-report
          path: reports/retrain/promotion_report.json
