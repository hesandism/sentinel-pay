# SentinelPay — full stack (Phases 4–8)
# ======================================
# One command brings up the whole scoring service, reproducibly, from a plain
# `git clone` — no local data, no local MLflow DB, no "works on my machine".
#
#     docker compose up --build
#
# Services & start order (enforced by healthchecks + depends_on):
#
#   redis      ── in-memory store for each card's recent history (online features)
#   mlflow     ── tracking server + model registry (its own fresh volume)
#   registrar  ── ONE-SHOT: logs artifacts/phase2/model_calibrated.joblib into
#                 MLflow and sets the @production alias, then exits. This is what
#                 makes the API's `models:/SentinelPayFraudModel@production` load
#                 succeed on a fresh machine (fixes the "path not found" error).
#   api        ── FastAPI /score endpoint; starts only AFTER the model is
#                 registered and Redis is healthy.
#
# Phase 5 adds the streaming pipeline on top of the same image:
#
#   redpanda   ── Kafka-compatible broker (no Zookeeper). Holds the
#                 `transactions` (live feed) and `alerts` (high-risk) topics.
#   postgres   ── durable sink; every scored transaction lands in a table.
#   producer   ── ONE-SHOT: replays Sparkov rows in timestamp order into
#                 `transactions`, then exits.
#   consumer   ── long-running: reads `transactions`, scores each via the API,
#                 writes to Postgres, and publishes high-risk ones to `alerts`.
#
# Phase 6 adds monitoring & drift detection:
#
#   monitor    ── compares the latest batch of scored transactions (Postgres)
#                 against the training reference with Evidently; exposes drift
#                 gauges on :8001/metrics and writes HTML reports.
#   prometheus ── scrapes api:8000/metrics + monitor:8001/metrics, evaluates
#                 the drift/ops alert rules (http://localhost:9090/alerts).
#   grafana    ── pre-provisioned live dashboard (http://localhost:3000).
#
# Phase 8 adds the demo-facing dashboard:
#
#   dashboard  ── Streamlit app (http://localhost:8501): live transaction
#                 stream, fraud alerts with per-alert SHAP explanations, model
#                 metrics, drift status and the last retraining gate decision.
#
# Data persists across restarts via the named volumes at the bottom.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    build: .                    # reuse the API image; just run a different command
    # --serve-artifacts + a "mlflow-artifacts:/" default root make the server
    # proxy ALL artifact uploads/downloads over HTTP. That way the registrar
    # (uploading the model) and the api (downloading it) go THROUGH the server,
    # so neither needs the artifact directory mounted locally. Without this, a
    # logged model's path (e.g. /mlflow/mlartifacts/...) exists only where it was
    # written and the API gets "No such file or directory" at load time.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
      --default-artifact-root mlflow-artifacts:/
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow     # sqlite DB + the ONLY real copy of artifacts
    healthcheck:
      # MLflow 2.13 serves this lightweight endpoint once the server is ready.
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  registrar:
    build: .
    command: ["python", "-m", "src.serve.register_model"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"               # one-shot: register the model, then exit 0

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      registrar:
        condition: service_completed_successfully   # model must be registered first
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 5 — streaming pipeline
  # ─────────────────────────────────────────────────────────────────────────
  redpanda:
    image: redpandadata/redpanda:v24.1.7
    # Redpanda is a single-binary, Kafka-API-compatible broker (no Zookeeper).
    # Two listeners: an INTERNAL one (redpanda:29092) that compose services use,
    # and an EXTERNAL one (localhost:9092) for clients on your host machine.
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"    # external Kafka listener (host clients)
      - "9644:9644"    # admin/metrics API
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelpay
    ports:
      # Host 5433 -> container 5432. We publish on 5433 to avoid colliding with a
      # native PostgreSQL install (which commonly squats on the host's 5432).
      # Inside the compose network services still reach it as `postgres:5432`.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelpay"]
      interval: 5s
      timeout: 3s
      retries: 10

  producer:
    build: .
    command: ["python", "-m", "src.stream.producer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      TRANSACTIONS_TOPIC: transactions
      # By default the producer GENERATES a fraud-rich synthetic feed
      # (src/synthetic_data.py) so the dashboard shows real fraud alerts without
      # the git-ignored Kaggle dataset. Set STREAM_SOURCE=csv (+ STREAM_CSV) to
      # replay a real CSV instead. See src/stream/config.py for every knob.
      STREAM_SOURCE: ${STREAM_SOURCE:-synthetic}
      STREAM_SYNTH_ROWS: ${STREAM_SYNTH_ROWS:-5000}
      STREAM_SYNTH_CARDS: "150"
      STREAM_SYNTH_FRAUD_RATE: ${STREAM_SYNTH_FRAUD_RATE:-0.30}
      STREAM_CSV: ${STREAM_CSV:-data/processed/test_time_split.csv}
      STREAM_LIMIT: "0"          # 0 = send the whole generated/loaded feed
      STREAM_SPEEDUP: "120"
      STREAM_MAX_DELAY: "1.0"
    volumes:
      # data/ is git-ignored and NOT baked into the image, so mount it read-only.
      - ./data:/app/data:ro
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"                # one-shot: replay the feed, then exit

  consumer:
    build: .
    command: ["python", "-m", "src.stream.consumer"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      TRANSACTIONS_TOPIC: transactions
      ALERTS_TOPIC: alerts
      SCORING_API_URL: http://api:8000/score
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpay
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy    # must be able to score before consuming
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 6 — monitoring & drift detection
  # ─────────────────────────────────────────────────────────────────────────
  monitor:
    build: .                    # same image again; just a different command
    command: ["python", "-m", "src.monitor.drift_monitor"]
    ports:
      - "8001:8001"             # Prometheus metrics (drift gauges)
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpay
      REFERENCE_CSV: ${REFERENCE_CSV:-data/processed/train_time_split.csv}
      # Check every 30s against the last 500 scored transactions.
      MONITOR_INTERVAL_S: "30"
      MONITOR_BATCH_ROWS: "500"
      MONITOR_MIN_ROWS: "100"
    volumes:
      # Training reference CSV (git-ignored, so mounted like the producer's).
      - ./data:/app/data:ro
      # Evidently HTML reports land on the host for easy opening in a browser.
      - ./reports/monitoring:/app/reports/monitoring
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
      - monitor

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      # Demo-only auth: open the dashboard with zero login friction. Anyone on
      # localhost is an admin — do NOT ship this outside a local demo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      # Auto-provision the Prometheus datasource + the SentinelPay dashboard.
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 8 — Streamlit dashboard (the demo front door)
  # ─────────────────────────────────────────────────────────────────────────
  # Reads Postgres (stream + alerts), Prometheus (drift gauges) and MLflow
  # (which version holds @production). Its own slim image — see
  # Dockerfile.dashboard — so it skips the heavy ML dependencies entirely.
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpay
      PROMETHEUS_URL: http://prometheus:9090
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Offline metrics + the Phase-7 promotion gate report, straight off the
      # host so a retrain run shows up on the next dashboard refresh.
      - ./reports:/app/reports:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────────────────
  # Phase 7 — automated retraining (opt-in: `--profile retrain`)
  # ─────────────────────────────────────────────────────────────────────────
  # ONE-SHOT: pulls recent labelled transactions from Postgres, retrains a
  # challenger with the Phase-2/3 pipeline, evaluates champion vs challenger on
  # a shared held-out window, and promotes in MLflow ONLY if the gate passes.
  # Run on a schedule (cron / Task Scheduler) or on drift via
  # scripts/auto_retrain_on_drift.py:
  #
  #     docker compose --profile retrain run --rm retrainer
  retrainer:
    build: .
    profiles: ["retrain"]      # excluded from a plain `docker compose up`
    command: ["python", "-m", "src.retrain"]
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://sentinel:sentinel@postgres:5432/sentinelpay
    volumes:
      - ./data:/app/data:ro                      # base training CSV (git-ignored)
      - ./reports/retrain:/app/reports/retrain   # promotion_report.json on the host
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  redis-data:
  mlflow-data:
  redpanda-data:
  postgres-data:
  prometheus-data:
  grafana-data:
