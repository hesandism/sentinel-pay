# SentinelPay — Prometheus configuration (Phase 6)
# =================================================
# Scrapes two targets inside the compose network:
#   api:8000/metrics      — operational metrics (latency, throughput, decisions)
#   monitor:8001/metrics  — drift metrics from the Evidently drift monitor
#
# A 5s scrape/evaluation interval is snappier than the 15s default so the demo
# (replay 1000 txns, watch the dashboard move) feels live.

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sentinelpay-api
    static_configs:
      - targets: ["api:8000"]

  - job_name: sentinelpay-drift-monitor
    static_configs:
      - targets: ["monitor:8001"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
